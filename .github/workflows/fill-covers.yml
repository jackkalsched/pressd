name: Fill covers

# Tops up every album copy whose tracklist is missing or short
# (worker/fill_tracklists.py, backend/tracklist_fill.py), then looks again for a
# cover for every copy saved without one (worker/fill_covers.py,
# backend/covers.py). Tracklists first, so a copy that gains its songs tonight
# can gain its cover in the same run. A record added before or on its release
# day often has neither in full yet; this picks them up once a catalog lists them.

on:
  schedule:
    - cron: "40 11 * * *" # daily, 03:40 PT
  workflow_dispatch:

concurrency:
  group: fill-covers
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-worker.txt

      - name: Top up missing and short tracklists
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m worker.fill_tracklists

      - name: Fill in missing album covers
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m worker.fill_covers
