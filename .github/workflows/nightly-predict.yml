name: Nightly predictions

# Per-user prediction pipeline (PLAN_ml_worker_split §4, phase B).
#
# Audio ingest (phase A) cannot run here: yt-dlp is bot-blocked from datacenter
# IPs. It runs on the Mac under launchd at 00:30 *local* time (ops/launchd/install.sh):
# two hours ahead of this on Pacific time, further ahead in other zones, and ahead
# of the next run either way. It is not a self-hosted runner job on purpose — this
# repository is public, and a fork's pull request could target a self-hosted
# runner and execute code on the machine that holds .env.
#
# `audio-health` is how that job reports back. It reads the ingest's workerrun
# row and fails if the last run errored or is stale, and it is independent of
# `predict` on purpose: predictions still run on whatever audio exists, and a
# dead ingest goes red on its own instead of silently for weeks.
#
# `taste-health` scores taste overlap's shipped baseline against the factorization
# on held-out song scores and records a workerrun row (job taste_health) for Jack's
# morning brief (worker/taste_health.py). It runs after `predict` whatever that did,
# and is red when the check itself fails or when the nightly taste_overlap stage
# errored, died at 'running' (>6h) or last ran over 36h ago. When a milestone fires the full
# checkpoint report goes into that row (`report_md`), never into an artifact or a
# file: it names users, and this repository is public.

# Normally started by the Mac the moment its audio ingest succeeds (worker/
# audio_ingest.py, start_predictions — a workflow_dispatch). The cron is the
# fallback for a night the Mac doesn't run; it skips itself if a full run
# finished in the last 20 hours. GitHub ran this schedule 5–9 hours late
# through October 2026.

on:
  schedule:
    - cron: "30 9 * * *" # 2:30am PT
  workflow_dispatch:
    inputs:
      user:
        description: "Run for a single user id (blank = all eligible users)"
        required: false
        type: string

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-worker.txt

      - name: Run nightly predictions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          if [ -n "${{ inputs.user }}" ]; then
            python -m worker.nightly_predict --user "${{ inputs.user }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python -m worker.nightly_predict --skip-if-ran-within 20
          else
            python -m worker.nightly_predict
          fi

  audio-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-worker.txt

      - name: Check the Mac's nightly audio ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m worker.audio_health

  taste-health:
    needs: predict
    if: always()
    runs-on: ubuntu-latest
    # Measured 2026-11-03 on a laptop, read-only: the health check 13 s, the full
    # checkpoint report a milestone night adds 48 s (79 users with a record). 30 min is
    # far past 3x that, with room for the report to grow with the userbase.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-worker.txt

      - name: Check taste overlap against the factorization
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m worker.taste_health
